# 실행 파일을 만들어 둔다 — 터미널을 안 써도 되게.
#
# 사용자 컴퓨터의 터미널을 쓸 수 없어서, 받아서 두 번 누르면 켜지는
# 파일이 필요했다. 깃허브가 대신 만들어 준다.
#
#   받는 법: 깃허브 저장소 -> Actions 탭 -> 제일 위 줄 -> Artifacts
#
# 맥도 만들려면 아래 matrix 의 주석 두 줄을 살리면 된다.
# (지금은 안 만든다 — 사용자가 "지금 만들라는 건 아님" 이라고 했다)

name: 실행 파일 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:          # 손으로도 돌릴 수 있게

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: 포켓몬도우미-윈도우
            sep: ";"          # --add-data 구분자가 윈도우만 다르다
          # - os: macos-latest
          #   name: 포켓몬도우미-맥
          #   sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 이 프로젝트는 바깥 라이브러리를 하나도 안 쓴다. 묶는 도구만 받는다.
      - run: pip install pyinstaller

      # ! **한글이 화면에 찍히는지부터 본다.**
      #   윈도우는 화면 인코딩이 cp949/cp1252 라, UTF-8 한글을 찍으면
      #   프로그램이 통째로 죽는다 (UnicodeEncodeError). 리눅스·맥에서는
      #   절대 안 나는 일이라 짜는 동안에는 못 만난다. 실제로 첫 빌드가
      #   tests.py 첫 줄에서 이걸로 터졌다.
      #   검사보다 먼저 두는 이유: 이게 깨지면 뒤는 볼 것도 없고,
      #   검사(2~3분)를 기다린 뒤에 알게 되면 시간만 버린다.
      - name: 한글이 찍히는지 (윈도우만 나는 고장)
        run: python -c "import paths; paths.fix_console(); print('한글 출력 확인 — 포켓몬 기술 도구')"

      # **묶기 전에 검사를 돌린다.** 깨진 채로 내보내지 않는다.
      - run: python tests.py

      # ! **창 UI 는 리눅스에서 볼 수가 없다.** 개발 컨테이너에 tkinter 도
      #   화면도 없어서, 여기가 창을 만들어 보는 유일한 자리다.
      #   위젯을 전부 만들고 파티를 읽고 추천까지 한 번 돌려 본다.
      #   (눌러 봐야 아는 것은 여전히 사용자 몫이다)
      - name: 창이 만들어지는지 (윈도우에서만 볼 수 있다)
        run: python gui.py --점검

      - name: 묶기 (창판 · 글자판 둘 다)
        shell: bash
        run: |
          # 창판 — 두 번 눌러 켜는 것. --console 을 붙여 둔다.
          # 창이 안 뜨는 컴퓨터에서도 왜 안 뜨는지 읽을 수 있어야 한다.
          pyinstaller --onefile --console \
            --name "${{ matrix.name }}" \
            --add-data "data${{ matrix.sep }}data" \
            gui.py
          # 글자판 — 창이 안 될 때 쓰는 것
          pyinstaller --onefile --console \
            --name "${{ matrix.name }}-글자판" \
            --add-data "data${{ matrix.sep }}data" \
            live.py

      # 묶은 것이 정말 켜지는지 확인한다. 자료를 못 찾으면 여기서 걸린다.
      #
      # ! 넣는 글을 **파일로 만들어서 준다.** printf 로 파이프에 밀어 넣으면
      #   윈도우에서 한글이 깨져서 들어간다. 두 번째 빌드가 그걸로 걸렸는데,
      #   화면 출력은 멀쩡해서 원인을 찾는 데 시간이 걸렸다.
      - name: 켜지는지 확인
        shell: bash
        run: |
          cd dist
          {
            echo "한카리아스 지진,역린,화염방사,칼춤"
            echo ""
            echo "하마돈 초3"
            echo "q"
            echo ""
          } > 넣을글.txt
          ./"${{ matrix.name }}-글자판"* < 넣을글.txt > 나온글.txt 2>&1 || true
          echo "----- 프로그램이 뱉은 것 -----"
          cat 나온글.txt
          echo "------------------------------"
          grep -q "=>" 나온글.txt || {
            echo "추천(=>)이 안 나왔습니다 — 위 출력을 보세요"
            exit 1
          }
          grep -q "포켓몬 챔피언스" 나온글.txt || {
            echo "한글이 깨졌습니다"
            exit 1
          }
          # 프로그램이 확인 중에 '내기록' 을 만든다 — 윈도우에서도 쓰기가
          # 된다는 증거다. 다만 배포에 딸려 가면 안 되므로 여기서 지운다.
          # (전에 이걸 안 지워서 파일 3개가 올라갔다)
          test -d 내기록 || { echo "내기록 폴더가 안 생겼습니다 — 쓰기가 안 된다"; exit 1; }
          echo "쓰기 확인:"; find 내기록 -type f
          rm -rf 넣을글.txt 나온글.txt 내기록

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
